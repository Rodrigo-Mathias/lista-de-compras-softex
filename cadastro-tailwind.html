<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de Produto</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white text-[#1a1a1a] font-sans p-4 leading-relaxed text-left">

  <header class="flex flex-wrap items-center justify-between border-b border-gray-200 pb-2 mb-4">
    <h1 class="text-4xl font-bold text-[#333333] pb-2">Sua Lista de Compras</h1>
    <nav class="flex flex-wrap gap-5 w-full sm:w-auto mt-4 sm:mt-0">
      <a href="index-tailwind.html" class="text-black text-lg font-medium hover:text-[#2f323d] hover:border-b-2 hover:border-[#3a3c45] pb-1">Início</a>
      <a href="cadastro-tailwind.html" class="text-black text-lg font-medium hover:text-[#2f323d] hover:border-b-2 hover:border-[#3a3c45] pb-1">Cadastro de Produtos</a>
      <a href="lista-tailwind.html" class="text-black text-lg font-medium hover:text-[#2f323d] hover:border-b-2 hover:border-[#3a3c45] pb-1">Lista de Produtos</a>
    </nav>
  </header>
  <main class="max-w-2xl mx-auto">
    <h2 class="text-2xl sm:text-3xl font-semibold text-[#303033] mb-6">Cadastro de Produto</h2>

    <form id="formProduto" class="space-y-4">
      <input type="hidden" id="produtoId" />

      <label class="block text-[#444] font-medium">
        Nome:
        <input
          type="text"
          id="nome"
          placeholder="Digite o nome de um Produto"
          required
          class="w-full p-3 rounded-lg border border-[#cfd7e3] text-base focus:outline-none focus:ring-2 focus:ring-[#1428a0]"
        />
      </label>

      <label class="block text-[#444] font-medium">
        Preço:
        <input
          type="number"
          id="preco"
          placeholder="Digite o preço do produto"
          step="0.01"
          min="0"
          required
          class="w-full p-3 rounded-lg border border-[#cfd7e3] text-base focus:outline-none focus:ring-2 focus:ring-[#1428a0]"
        />
      </label>

      <label class="block text-[#444] font-medium">
        Categoria:
        <input
          type="text"
          id="categoria"
          placeholder="Digite a categoria que o produto pertence"
          required
          class="w-full p-3 rounded-lg border border-[#cfd7e3] text-base focus:outline-none focus:ring-2 focus:ring-[#1428a0]"
        />
      </label>

      <label class="block text-[#444] font-medium">
        Origem:
        <input
          type="text"
          id="origem"
          placeholder="Qual a origem?"
          required
          class="w-full p-3 rounded-lg border border-[#cfd7e3] text-base focus:outline-none focus:ring-2 focus:ring-[#1428a0]"
        />
      </label>

      <label class="block text-[#444] font-medium">
        Lote:
        <input
          type="text"
          id="lote"
          placeholder="Qual o Lote?"
          required
          class="w-full p-3 rounded-lg border border-[#cfd7e3] text-base focus:outline-none focus:ring-2 focus:ring-[#1428a0]"
        />
      </label>

      <label class="block text-[#444] font-medium">
        Data de Validade:
        <input
          type="date"
          id="validade"
          required
          class="w-full p-3 rounded-lg border border-[#cfd7e3] text-base focus:outline-none focus:ring-2 focus:ring-[#1428a0]"
        />
      </label>

      <button type="submit" class="w-full bg-[#59595a] text-white font-bold py-3 rounded-lg hover:bg-[#0a1d6c] transition-colors">
        Adicionar Produto
      </button>
    </form>
  </main>

  <script src="produtos-tailwind.js"></script>

</body>
</html>
